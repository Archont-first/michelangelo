<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'">
<title>michelangelo</title>
<style>
@font-face{font-family:"Young Serif";src:url(assets/fonts/young-serif-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";src:url(assets/fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2");font-weight:500;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"JetBrains Mono";src:url(assets/fonts/jetbrains-mono-greek-500-normal.woff2) format("woff2");font-weight:500;unicode-range:U+0370-03FF}
@font-face{font-family:"Inter";src:url(assets/fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";src:url(assets/fonts/inter-cyrillic-400-normal.woff2) format("woff2");unicode-range:U+0400-045F}
:root{--hero-bg:#F4EDE3;--ink:#151213;--red:#A4302A}
*{box-sizing:border-box}
html,body{margin:0;background:#F4EDE3;color:var(--ink);font:400 17px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
.nav{display:flex;align-items:center;justify-content:space-between;max-width:1280px;margin:0 auto;padding:22px clamp(16px,4vw,40px)}
.logo{font:400 28px/1 "Young Serif",Georgia,serif;color:var(--red);text-decoration:none;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;background:var(--ink);color:#F4EDE3;text-decoration:none;font-size:15px;transition:background .2s,transform .2s}
.btn:hover{background:var(--red);transform:translateY(-1px)}
.hero{position:relative;width:100%;height:clamp(300px,36vw,600px);touch-action:pan-y;cursor:crosshair}
.hero canvas{display:block}
.head{max-width:1280px;margin:0 auto;padding:clamp(28px,4vw,56px) clamp(16px,4vw,40px) 96px;text-align:center}
h1{margin:0;font:400 clamp(48px,8.4vw,128px)/.98 "Young Serif",Georgia,serif;letter-spacing:-.035em}
h1 span{color:var(--red)}
@media (max-width:560px){.logo{font-size:22px}.btn{min-height:38px;padding:0 14px;font-size:14px}}
</style>
<script src="assets/hero.js" defer></script>
</head>
<body>
<header class="nav"><a class="logo" href="#">michelangelo</a><a class="btn" href="https://t.me/foundermd" rel="noopener">get early access</a></header>
<section class="hero" data-hero data-src="assets/art/hands.jpg" aria-label="The Creation of Adam: God's hand is the fresco, Adam's hand is written in words"><canvas></canvas></section>
<div class="head"><h1>carve out<br>the <span>story</span>.</h1></div>
</body>
</html>
